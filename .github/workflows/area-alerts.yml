# Sends area alerts (incl. strong-earthquake "check MMS" notices) to the free ntfy app every 15 minutes. Nothing is committed.
name: Area alerts

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send alerts
        run: node scripts/send-area-alerts.mjs
