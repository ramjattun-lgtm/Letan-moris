# Builds "How right were the forecasts?" for the last 30 days. Runs every morning.
name: Forecast accuracy

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build accuracy
        run: node scripts/build-accuracy.mjs
      - name: Commit if changed
        run: |
          git config user.name "letan-moris-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --quiet || true
          git add src/data/accuracy.json
          git diff --cached --quiet || (git commit -m "Update forecast accuracy" && git push)
